<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rookie Coach</title>
  <style>
    body { width: 300px; margin: 0; padding: 16px; font: 14px/1.4 system-ui, sans-serif; color: #17233a; }
    h1 { margin: 0 0 12px; font-size: 18px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 8px; margin-bottom: 12px; }
    button { padding: 8px 12px; cursor: pointer; }
    p { margin: 12px 0; }
    #status { min-height: 2.8em; }
  </style>
  <script type="module" src="dist/popup.js"></script>
</head>
<body>
  <h1>Rookie Coach</h1>
  <p>Import only your own Codeforces history, with your permission. Your handle stays in this browser.</p>
  <form id="import-form">
    <label for="handle">Codeforces handle</label>
    <input id="handle" name="handle" autocomplete="off" required>
    <button type="submit">Start import</button>
  </form>
  <p id="status" role="status" aria-live="polite">The import connection is coming in a later run. No data is collected by this shell.</p>
</body>
</html>
